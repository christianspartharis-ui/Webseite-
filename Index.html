<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Vorregistrierung</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 { font-size: 26px; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
    input[type="email"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input[type="email"]:focus { border-color: var(--primary); }
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .checkbox-group input { margin-top: 3px; accent-color: var(--primary); }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 14px; font-weight: 500; display: none; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <div class="app-icon">🚀</div>
    <span class="badge">BALD IM GOOGLE PLAY STORE</span>
    <h1>Deine App</h1>
    <p>Trag dich jetzt unverbindlich ein und erfahre sofort, wenn die App zum Download bereitsteht!</p>

    <form id="waitlist-form">
      <!-- HIER DEINEN WEB3FORMS ACCESS KEY EINTRAGEN -->
      <input type="hidden" name="access_key" value="DEIN-ACCESS-KEY-HIER">
      <input type="hidden" name="subject" value="Neue App-Vorregistrierung!">

      <input type="email" name="email" placeholder="Deine E-Mail-Adresse (am besten Google-Mail)" required>

      <label class="checkbox-group">
        <input type="checkbox" name="beta_tester" value="Ja">
        <span>Ich möchte schon vorab als exklusiver Beta-Tester dabei sein.</span>
      </label>

      <label class="checkbox-group">
        <input type="checkbox" required>
        <span>Ich stimme zu, dass meine E-Mail für die einmalige Start-Benachrichtigung gespeichert wird.</span>
      </label>

      <button type="submit" id="submit-btn">Jetzt vorregistrieren</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('waitlist-form');
    const status = document.getElementById('status');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Wird eingetragen...';

      const formData = new FormData(form);
      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        status.style.display = 'block';
        if (data.success) {
          status.className = 'success';
          status.textContent = '🎉 Super! Du stehst auf der Liste.';
          form.reset();
        } else {
          status.className = 'error';
          status.textContent = 'Fehler beim Senden. Bitte versuche es erneut.';
        }
      } catch (err) {
        status.style.display = 'block';
        status.className = 'error';
        status.textContent = 'Netzwerkfehler. Bitte prüfe deine Verbindung.';
      }
      btn.disabled = false;
      btn.textContent = 'Jetzt vorregistrieren';
    });
  </script>
</body>
</html>
